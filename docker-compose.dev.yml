# Start this with: docker compose -f docker-compose.dev.yml up -d

services:

  uwithme-caddy:
    image: caddy:2.8.4
    container_name: uwithme-caddy
    restart: always
    volumes:
      - ./caddy-config:/etc/caddy
    command: caddy run --config /etc/caddy/Caddyfile.dev --adapter caddyfile
    ports:
      - "8080:8080"
      - "4180:4180"
      - "4181:4181"

  uwithme-oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
    container_name: uwithme-oauth2-proxy
    restart: always
    volumes:
      - ./oauth2-proxy-config:/etc/oauth2-proxy
    command: --config=/etc/oauth2-proxy/oauth2-proxy.cfg
    environment:
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://localhost:8080/realms/KhPI
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: true

      OAUTH2_PROXY_LOGIN_URL: http://localhost:8080/realms/KhPI/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: http://uwithme-keycloak:8080/realms/KhPI/protocol/openid-connect/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://uwithme-keycloak:8080/realms/KhPI/protocol/openid-connect/certs
      OAUTH2_PROXY_BACKEND_LOGOUT_URL: http://uwithme-keycloak:8080/realms/KhPI/protocol/openid-connect/logout?id_token_hint={id_token}

      OAUTH2_PROXY_CLIENT_SECRET: ${UI_KEYCLOAK_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${UI_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: false
    depends_on:
      - uwithme-keycloak

  uwithme-postgres:
    image: postgres:15.2
    container_name: uwithme-postgres
    restart: always
    volumes:
      - ./postgres-config:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      U_WITH_ME_DB_USER: ${U_WITH_ME_DB_USER}
      U_WITH_ME_DB_PASSWORD: ${U_WITH_ME_DB_PASSWORD}

      TEST_SYSTEM_DB_USER: ${TEST_SYSTEM_DB_USER}
      TEST_SYSTEM_DB_PASSWORD: ${TEST_SYSTEM_DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 5s
      timeout: 5s
      retries: 10

  uwithme-keycloak:
    image: quay.io/keycloak/keycloak:20.0.5
    container_name: uwithme-keycloak
    restart: always
    volumes:
      - ./keycloak-config:/opt/keycloak/data/import
    environment:
      KC_PROXY: edge
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://uwithme-postgres/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      KEYCLOAK_ADMIN: ${KEYCLOAK_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}
    command:
      - start-dev --import-realm
    depends_on:
      uwithme-postgres:
        condition: service_healthy
