#Start this with docker compose up -d
#To update images:
#    docker compose pull
#    docker compose up -d

services:

  uwithme-caddy:
    image: caddy:2.8.4
    container_name: uwithme-caddy
    restart: always
    volumes:
      - ./caddy-config:/etc/caddy
      - ~/caddy-data:/data
    environment:
      SCHEMA: http${SSL_ENABLED:+s}://
      KEYCLOAK_HOST: ${KEYCLOAK_HOST}
      U_WITH_ME_UI_HOST: ${U_WITH_ME_UI_HOST}
      TEST_SYSTEM_UI_HOST: ${TEST_SYSTEM_UI_HOST}
    networks:
      default:
        aliases:
          - ${KEYCLOAK_HOST}
    ports:
      - "80:80"
      - "443:443"

  uwithme-oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
    container_name: uwithme-oauth2-proxy
    restart: always
    volumes:
      - ./oauth2-proxy-config:/etc/oauth2-proxy
    command: --config=/etc/oauth2-proxy/oauth2-proxy.cfg
    environment:
      OAUTH2_PROXY_OIDC_ISSUER_URL: http${SSL_ENABLED:+s}://${KEYCLOAK_HOST}/realms/KhPI
      OAUTH2_PROXY_BACKEND_LOGOUT_URL: http${SSL_ENABLED:+s}://${KEYCLOAK_HOST}/realms/KhPI/protocol/openid-connect/logout?id_token_hint={id_token}
      OAUTH2_PROXY_CLIENT_SECRET: ${UI_KEYCLOAK_SECRET}

      OAUTH2_PROXY_COOKIE_SECRET: ${UI_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: ${SSL_ENABLED:-false}
      OAUTH2_PROXY_COOKIE_DOMAINS: .${U_WITH_ME_UI_HOST}

  uwithme-postgres:
    image: postgres:15.2
    container_name: uwithme-postgres
    restart: always
    volumes:
      - ./postgres-config:/docker-entrypoint-initdb.d
      - ~/postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      U_WITH_ME_DB_USER: ${U_WITH_ME_DB_USER}
      U_WITH_ME_DB_PASSWORD: ${U_WITH_ME_DB_PASSWORD}

      TEST_SYSTEM_DB_USER: ${TEST_SYSTEM_DB_USER}
      TEST_SYSTEM_DB_PASSWORD: ${TEST_SYSTEM_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 5s
      timeout: 5s
      retries: 10

  uwithme-keycloak:
    image: quay.io/keycloak/keycloak:20.0.5
    container_name: uwithme-keycloak
    restart: always
    volumes:
      - ./keycloak-config:/opt/keycloak/data/import
    environment:
      KC_PROXY: edge
      KC_HOSTNAME: ${KEYCLOAK_HOST}
      KC_HOSTNAME_STRICT_HTTPS: ${SSL_ENABLED:-false}

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://uwithme-postgres/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      KEYCLOAK_ADMIN: ${KEYCLOAK_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}
    command:
      - start --import-realm
    depends_on:
      uwithme-postgres:
        condition: service_healthy

  uwithme-service:
    image: ghcr.io/happymary16/uwithme-server/uwithme-service:latest
    container_name: uwithme-service
    restart: always
    volumes:
      - ~/uwm-data:/usr/app/uwithme-users-files
    environment:
      SSL_ENABLED: ${SSL_ENABLED}
      UWITHME_JDBC_URL: jdbc:postgresql://uwithme-postgres/uwithme
      UWITHME_JDBC_USER: ${U_WITH_ME_DB_USER}
      UWITHME_JDBC_PASSWORD: ${U_WITH_ME_DB_PASSWORD}
      UWITHME_KEYCLOAK_HOST: ${KEYCLOAK_HOST}
      UWITHME_KEYCLOAK_REALM: KhPI
      UWITHME_KEYCLOAK_SECRET: ${U_WITH_ME_SERVICE_KEYCLOAK_SECRET}
    depends_on:
      uwithme-postgres:
        condition: service_healthy

  uwithme-ui:
    image: ghcr.io/happymary16/uwithme-client/uwithme-client:latest
    container_name: uwithme-ui
    restart: always
    environment:
      SSL_ENABLED: ${SSL_ENABLED}
      UWITHME_KEYCLOAK_HOST: ${KEYCLOAK_HOST}
      UWITHME_KEYCLOAK_REALM: KhPI
      UWITHME_TESTSYSTEM_URL: ${TEST_SYSTEM_UI_HOST}

  uwithme-tests-service:
    image: ghcr.io/misha999777/uwithme-tests-service/uwithme-tests-service:latest
    container_name: uwithme-tests-service
    restart: always
    environment:
      SSL_ENABLED: ${SSL_ENABLED}
      TESTSYSTEM_JDBC_URL: jdbc:postgresql://uwithme-postgres/testsystem
      TESTSYSTEM_JDBC_USERNAME: ${TEST_SYSTEM_DB_USER}
      TESTSYSTEM_JDBC_PASSWORD: ${TEST_SYSTEM_DB_PASSWORD}
      TESTSYSTEM_KEYCLOAK_HOST: ${KEYCLOAK_HOST}
      TESTSYSTEM_KEYCLOAK_REALM: KhPI
      TESTSYSTEM_KEYCLOAK_SECRET: ${TEST_SYSTEM_SERVICE_KEYCLOAK_SECRET}
    depends_on:
      uwithme-postgres:
        condition: service_healthy

  uwithme-tests-ui:
    image: ghcr.io/misha999777/uwithme-tests-ui/uwithme-tests-ui:latest
    container_name: uwithme-tests-ui
    restart: always
